name: CI para cloud_native

on:
  push:
    branches:
      - main

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions: 
      contents: read
      packages: write
    environment: polo_env
    steps:
      - name: revision_de_codigo
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: build_polo_app
        run: |
          chmod 700 ./gradlew
          ./gradlew bootJar -x test

      - name: login_github_registry
        uses: docker/login-action@v3 
        with:
          registry: ${{ secrets.GITHUB_REGISTRY }}
          username: ${{ secrets.GITHUB_USER }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build_push_image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ secrets.GITHUB_REGISTRY }}/mascotas-back-img:latest

      - name: deploy_ec2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_IP }}
          username: ec2-user
          key: ${{ secrets.SSH_KEY }}
          script: |
            if [ ! -f /swapfile ]; then
              sudo dd if=/dev/zero of=/swapfile bs=1M count=2048
              sudo chomd 400 /swapfile
              sudo mkswap /swapfile
              sudo swapon /swapfile
            fi

            if ! command -v docker &> /dev/null; then 
              sudo dnf update -y
              sudo dnf install -y docker
              sudo systemctl enable docker --now
              sudo usermod -aG docker ec2-user
            fi

            sg docker -c "
              docker pull ${{ secrets.GITHUB_REGISTRY }}/mascotas-back-img:latest

              docker stop backend-cont || true
              docker rm backend-cont || true
              docker image prune -f

              docker run -d \
                --name backend-cont \
                -p 8080:8080 \
                -e PUBLIC_HOST_URL='http://$EC2_IP' \
                --restart unless-stopped \
                ${{ secrets.GITHUB_REGISTRY }}/mascotas-back-img:latest
            "